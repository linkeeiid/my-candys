<!DOCTYPE html>
<!-- deploy: cloudflare -->
<!-- Console My Candy's — version REACT (chargée par CDN, sans build Node).
     React + ReactDOM + Babel (JSX in-browser) + Tailwind Play CDN.
     Adaptation du composant Sidebar fourni : next/link→<a>, next/image→<img>,
     lucide-react→SVG inline, framer-motion→state React + transitions CSS. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Candy's — Console (React)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png">

<!-- Tailwind (Play CDN — génère les classes à la volée, pas de build) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: {
      candy:  { DEFAULT: '#E01784', light: '#FF2E9A', 50:'#FFF6FB', 100:'#FFE3F1', 200:'#F3C6DE' },
      ink:    '#2A0A1C',
      side:   { DEFAULT:'#241019', 2:'#160810' }
    },
    fontFamily: { sans:['Poppins','ui-sans-serif','system-ui','sans-serif'] } } }
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{background:#f5f2f6}
  ::selection{background:#E01784;color:#fff}
  /* barre de scroll fine dans la sidebar */
  .nav-scroll::-webkit-scrollbar{width:0}
</style>

<!-- React via CDN (UMD) + Babel pour le JSX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---------- Icônes (SVG inline, en remplacement de lucide-react) ---------- */
const Ic = ({ d, extra }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
       strokeLinecap="round" strokeLinejoin="round" className="h-5 w-5 flex-shrink-0">
    {Array.isArray(d) ? d.map((p,i)=><path key={i} d={p}/>) : <path d={d}/>}
    {extra}
  </svg>
);
const IconDashboard = () => <Ic extra={<>
  <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
  <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>} />;
const IconBox = () => <Ic d={["M3 8l9-5 9 5v8l-9 5-9-5z","M3 8l9 5 9-5M12 13v8"]} />;
const IconTag = () => <Ic extra={<><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0l-7-7A1.9 1.9 0 013 12.2V4a2 2 0 012-2h8.2c.5 0 1 .2 1.4.6l6 6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/></>} />;
const IconOrders = () => <Ic d={["M6 3h12v18l-3-2-3 2-3-2-3 2V3z","M9 8h6M9 12h6"]} />;
const IconUsers = () => <Ic extra={<><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0112 0"/><path d="M16 5.5a3 3 0 010 5.8M21 20a6 6 0 00-4-5.6"/></>} />;
const IconMail = () => <Ic d={["M3 7l9 6 9-6"]} extra={<rect x="3" y="5" width="18" height="14" rx="2"/>} />;
const IconChart = () => <Ic d={["M3 21h18"]} extra={<><rect x="5" y="11" width="3.4" height="7" rx="1"/><rect x="10.3" y="6" width="3.4" height="12" rx="1"/><rect x="15.6" y="13" width="3.4" height="5" rx="1"/></>} />;
const IconLogout = () => <Ic d={["M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4","M16 17l5-5-5-5","M21 12H9"]} />;

/* ---------- Sidebar repliable (state React + transition CSS) ---------- */
function Sidebar({ open, setOpen, children }) {
  return (
    <aside
      onMouseEnter={() => setOpen(true)}
      onMouseLeave={() => setOpen(false)}
      style={{ width: open ? 260 : 76 }}
      className="hidden md:flex md:flex-col flex-shrink-0 h-screen sticky top-0 overflow-hidden
                 bg-gradient-to-b from-side-2 to-side text-neutral-300 border-r border-white/5
                 transition-[width] duration-300 ease-out z-40"
    >
      {children}
    </aside>
  );
}

function SidebarLink({ icon, label, active, open, href = "#", onClick }) {
  return (
    <a href={href} onClick={onClick}
       className={"group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold whitespace-nowrap transition " +
         (active ? "bg-white/10 text-white shadow-[inset_2px_0_0_#FF2E9A]" : "text-neutral-300 hover:bg-white/5 hover:text-white")}>
      <span className={active ? "text-candy-light" : "opacity-80 group-hover:opacity-100"}>{icon}</span>
      <span className="transition-opacity duration-150" style={{ opacity: open ? 1 : 0 }}>{label}</span>
    </a>
  );
}

/* ---------- Cartes KPI ---------- */
function Kpi({ label, value, sub, accent }) {
  return (
    <div className="flex-1 rounded-2xl border border-candy-200/60 bg-white p-4 shadow-sm">
      <div className="text-[11px] font-bold uppercase tracking-wider text-neutral-400">{label}</div>
      <div className={"mt-1 text-2xl font-extrabold tabular-nums " + (accent || "text-ink")}>{value}</div>
      {sub && <div className="mt-0.5 text-xs text-neutral-400">{sub}</div>}
    </div>
  );
}

/* ---------- Contenu du dashboard ---------- */
function Dashboard() {
  return (
    <main className="flex-1 min-w-0 flex flex-col">
      {/* Topbar */}
      <header className="sticky top-0 z-20 flex items-center gap-3 border-b border-neutral-200 bg-white/80 px-6 py-3 backdrop-blur">
        <div className="min-w-0">
          <h1 className="font-bold text-xl leading-tight text-ink">Tableau de bord</h1>
          <p className="text-xs text-neutral-400">Vue d'ensemble de l'activité</p>
        </div>
        <div className="ml-auto flex items-center gap-2 rounded-xl border border-neutral-200 bg-white px-3 py-2 w-[min(260px,32vw)]">
          <svg viewBox="0 0 24 24" className="h-4 w-4 text-neutral-400" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input placeholder="Rechercher…" className="w-full bg-transparent text-sm outline-none text-ink" />
        </div>
        <span className="hidden sm:inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-bold text-emerald-600">
          <span className="h-2 w-2 rounded-full bg-emerald-500"></span> Synchronisé
        </span>
      </header>

      {/* Corps */}
      <div className="flex-1 space-y-4 p-4 md:p-6">
        <div className="flex flex-col gap-3 sm:flex-row">
          <Kpi label="Chiffre d'affaires" value="195,77 €" accent="text-candy" />
          <Kpi label="Commandes" value="53" sub="dont 2 à expédier" />
          <Kpi label="À expédier" value="2" accent="text-amber-600" />
          <Kpi label="Panier moyen" value="18,40 €" accent="text-emerald-600" />
        </div>

        <div className="rounded-2xl border border-neutral-200 bg-white p-5">
          <div className="mb-3 flex items-center justify-between">
            <h3 className="font-bold text-ink">🏆 Top produits</h3>
            <button className="rounded-lg border border-neutral-200 px-3 py-1.5 text-sm font-semibold text-neutral-600 hover:bg-neutral-50">Voir les stats</button>
          </div>
          <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
            {["Takis Fuego","Candy Fruit","Prime Ice Pop","Mystery Box"].map((n,i)=>(
              <div key={i} className="rounded-xl bg-candy-50 p-3">
                <div className="h-16 rounded-lg bg-candy-100"></div>
                <div className="mt-2 truncate text-sm font-semibold text-ink">{n}</div>
                <div className="text-xs text-neutral-400">{40 - i*7} ventes</div>
              </div>
            ))}
          </div>
        </div>

        <div className="rounded-2xl border border-neutral-200 bg-white p-5">
          <h3 className="mb-3 font-bold text-ink">Commandes récentes</h3>
          <div className="overflow-hidden rounded-xl border border-neutral-100">
            <table className="w-full text-sm">
              <thead className="bg-neutral-50 text-left text-xs uppercase tracking-wide text-neutral-400">
                <tr><th className="px-4 py-2.5">Commande</th><th className="px-4 py-2.5">Client</th><th className="px-4 py-2.5">Total</th><th className="px-4 py-2.5">Statut</th></tr>
              </thead>
              <tbody className="divide-y divide-neutral-100">
                {[["MC-444009","Inès E.","19,90 €","Nouvelle","bg-candy-100 text-candy"],
                  ["MC-357821","Vincent","34,80 €","Expédiée","bg-emerald-100 text-emerald-700"],
                  ["MC-198332","Francis","12,50 €","En cours","bg-amber-100 text-amber-700"]].map((r,i)=>(
                  <tr key={i} className="text-ink">
                    <td className="px-4 py-3 font-semibold">{r[0]}</td>
                    <td className="px-4 py-3">{r[1]}</td>
                    <td className="px-4 py-3 tabular-nums">{r[2]}</td>
                    <td className="px-4 py-3"><span className={"rounded-full px-2.5 py-1 text-xs font-bold "+r[4]}>{r[3]}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  );
}

/* ---------- App ---------- */
function App() {
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState("dash");
  const links = [
    { key:"dash",     label:"Tableau de bord", icon:<IconDashboard/> },
    { key:"stats",    label:"Statistiques",    icon:<IconChart/> },
    { key:"products", label:"Produits",        icon:<IconTag/> },
    { key:"boxes",    label:"Box mystères",    icon:<IconBox/> },
    { key:"orders",   label:"Commandes",       icon:<IconOrders/> },
    { key:"inbox",    label:"Boîte de réception", icon:<IconMail/> },
    { key:"clients",  label:"Clients",         icon:<IconUsers/> },
  ];
  return (
    <div className="flex min-h-screen">
      <Sidebar open={open} setOpen={setOpen}>
        {/* Marque */}
        <a href="/console" className="flex items-center gap-2.5 px-4 py-4">
          <img src="assets/logo.png" alt="My Candy's" className="h-9 w-9 flex-shrink-0 object-contain" />
          <div className="leading-tight transition-opacity duration-150" style={{ opacity: open ? 1 : 0 }}>
            <div className="font-bold text-white whitespace-nowrap">My Candy's</div>
            <div className="text-[10px] font-bold uppercase tracking-widest text-neutral-400">Admin · LinkedIA</div>
          </div>
        </a>
        {/* Liens */}
        <nav className="nav-scroll flex-1 space-y-1 overflow-y-auto px-3 py-2">
          {links.map(l => (
            <SidebarLink key={l.key} icon={l.icon} label={l.label} open={open}
              active={active===l.key} onClick={(e)=>{e.preventDefault(); setActive(l.key);}} />
          ))}
        </nav>
        {/* Pied : utilisateur + déconnexion */}
        <div className="border-t border-white/5 p-3 space-y-1">
          <SidebarLink icon={<IconLogout/>} label="Se déconnecter" open={open} href="/console" />
          <div className="flex items-center gap-2.5 px-3 py-1.5">
            <div className="grid h-8 w-8 flex-shrink-0 place-items-center rounded-full bg-gradient-to-br from-candy-light to-candy text-xs font-extrabold text-white">GR</div>
            <div className="leading-tight transition-opacity duration-150" style={{ opacity: open ? 1 : 0 }}>
              <div className="text-sm font-bold text-white whitespace-nowrap">Gérant</div>
              <div className="text-[10px] text-neutral-400">My Candy's</div>
            </div>
          </div>
        </div>
      </Sidebar>
      <Dashboard />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
