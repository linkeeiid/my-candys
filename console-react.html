/* ---- sidebar (composant fourni, next/link->a) ---- */
const SidebarContext = createContext(undefined);
const useSidebar = () => { const c=useContext(SidebarContext); if(!c) throw new Error('useSidebar must be used within a SidebarProvider'); return c; };
const SidebarProvider = ({children,open:op,setOpen:sp,animate=true}) => { const [s,ss]=useState(false); const open=op!==undefined?op:s; const setOpen=sp!==undefined?sp:ss; return <SidebarContext.Provider value={{open,setOpen,animate}}>{children}</SidebarContext.Provider>; };
const Sidebar = ({children,open,setOpen,animate}) => <SidebarProvider open={open} setOpen={setOpen} animate={animate}>{children}</SidebarProvider>;
const SidebarBody = (props) => (<><DesktopSidebar {...props}/><MobileSidebar {...props}/></>);
const DesktopSidebar = ({className,children,...props}) => {
  const {open,setOpen,animate}=useSidebar();
  return <motion.div className={cn('h-full px-4 py-4 hidden md:flex md:flex-col bg-gradient-to-b from-side-2 to-side w-[300px] flex-shrink-0 overflow-hidden',className)}
    animate={{width:animate?(open?'300px':'60px'):'300px'}} onMouseEnter={()=>setOpen(true)} onMouseLeave={()=>setOpen(false)} {...props}>{children}</motion.div>;
};
const MobileSidebar = ({className,children,...props}) => {
  const {open,setOpen}=useSidebar();
  return <div className="h-12 px-4 py-4 flex flex-row md:hidden items-center justify-between bg-gradient-to-b from-side-2 to-side w-full" {...props}>
    <div className="flex justify-end z-20 w-full"><Menu onClick={()=>setOpen(!open)}/></div>
    <AnimatePresence>{open && <motion.div initial={{x:'-100%',opacity:0}} animate={{x:0,opacity:1}} exit={{x:'-100%',opacity:0}} className={cn('fixed h-full w-full inset-0 bg-gradient-to-b from-side-2 to-side p-8 z-[100] flex flex-col justify-between overflow-y-auto',className)}>
      <div className="absolute right-8 top-8 z-50"><X onClick={()=>setOpen(!open)}/></div>{children}</motion.div>}</AnimatePresence>
  </div>;
};
const SidebarLink = ({link,active,onClick}) => {
  const {open,animate}=useSidebar();
  return <a href={link.href} onClick={onClick} className={cn('flex items-center justify-start gap-2 group/sidebar rounded-xl px-2 py-2 transition', active?'bg-white/10 shadow-[inset_2px_0_0_#FF2E9A]':'hover:bg-white/5')}>

  <div className="flex flex-wrap gap-2">{['Toutes','Nouvelles','En cours','Traitées','Expédiées'].map((c,i)=>(<button key={c} className={cn('rounded-full border px-3 py-1.5 text-sm font-semibold',i===0?'border-ink bg-ink text-white':'border-neutral-200 bg-white text-neutral-600')}>{c}</button>))}</div>
  <Card className="p-5"><OrdersTable rows={ORDERS}/></Card>
</div>);

const VInbox = () => (<div className="grid gap-4 lg:grid-cols-2">
  <Card className="p-5"><h3 className="font-bold text-ink mb-3">📩 Inscrits newsletter <span className="text-neutral-400 font-semibold">(128)</span></h3>
    <div className="divide-y divide-neutral-100 text-sm">{['lea.martin@gmail.com','vincent83@icloud.com','nour.nourette@icloud.com','francis@estanquedeboulouris.fr'].map(e=>(<div key={e} className="flex justify-between py-2"><span>{e}</span><span className="text-neutral-400">15/09</span></div>))}</div></Card>
  <Card className="p-5"><h3 className="font-bold text-ink mb-3">✉️ Messages contact <span className="text-neutral-400 font-semibold">(2)</span></h3>

</div>);

const VClients = () => (<Card className="overflow-hidden"><div className="overflow-x-auto scroll"><table className="w-full text-sm min-w-[520px]">

  <tbody className="divide-y divide-neutral-100">{[['Inès E.','i.elouard@icloud.com',3,59.7],['Vincent','cedbip3@laposte.net',5,142.3],['Léa Martin','lea.martin@gmail.com',2,38.4],['Francis','info@estanquedeboulouris.fr',1,12.5]].map((c,i)=>(<tr key={i} className="text-ink"><td className="px-4 py-3 font-semibold whitespace-nowrap">{c[0]}</td><td className="px-4 py-3 text-neutral-500">{c[1]}</td><td className="px-4 py-3 text-right tabular-nums">{c[2]}</td><td className="px-4 py-3 text-right tabular-nums whitespace-nowrap">{money(c[3])}</td></tr>))}</tbody></table></div></Card>);

const VPromos = () => (<div className="grid gap-3 sm:grid-cols-3">{[['CANDYSUMMER26','-26 %','Offre d\'été'],['BIENVENUE10','-10 %','Newsletter'],['TAGADA10','-10 %','Relance client']].map(pm=>(<Card key={pm[0]} className="p-5 text-center"><div className="text-xs text-neutral-400">{pm[2]}</div><div className="my-1 text-2xl font-extrabold text-candy tracking-wide">{pm[0]}</div><Pill cls="bg-candy-50 text-candy">{pm[1]}</Pill></Card>))}</div>);

const VCats = () => (<Card className="p-5"><h3 className="font-bold text-ink mb-3">Catégories</h3>
  <div className="space-y-2">{Object.keys(CAT_COUNTS).map(c=>(<div key={c} className="flex items-center justify-between rounded-xl border border-neutral-100 px-4 py-2.5"><span className="font-semibold">{c}</span><span className="text-sm text-neutral-400">{CAT_COUNTS[c]} produits</span></div>))}</div>

  {k:'cats',label:'Catégories',icon:IC.cats('h-5 w-5 flex-shrink-0'),title:'Catégories',sub:'Rayons de la boutique',view:<VCats/>},

  {k:'reviews',label:'Avis',icon:IC.reviews('h-5 w-5 flex-shrink-0'),title:'Avis clients',sub:'Retours de la clientèle',view:<VReviews/>},

function App(){
  const [open,setOpen]=useState(false);
  const [view,setView]=useState('dash');
  const cur=TABS.find(t=>t.k===view)||TABS[0];
  return (<div className="flex flex-col md:flex-row w-full h-screen overflow-hidden bg-gray-100">
    <Sidebar open={open} setOpen={setOpen}>
      <SidebarBody className="justify-between gap-8">
        <div className="flex flex-col flex-1 overflow-y-auto overflow-x-hidden scroll">
          {open ? <Logo/> : <LogoIcon/>}
          <div className="mt-6 flex flex-col gap-1">{TABS.map(t=>(<SidebarLink key={t.k} link={{label:t.label,href:'#',icon:t.icon}} active={view===t.k} onClick={e=>{e.preventDefault();setView(t.k);setOpen(false);}}/>))}</div>
        </div>
        <div className="flex flex-col gap-1">
          <SidebarLink link={{label:'Se déconnecter',href:'/console',icon:IC.logout('h-5 w-5 flex-shrink-0')}}/>

        </div>
      </SidebarBody>
    </Sidebar>
    <main className="flex-1 min-w-0 flex flex-col">
      <header className="sticky top-0 z-20 flex items-center gap-3 border-b border-neutral-200 bg-white/80 px-5 py-3 backdrop-blur">
        <div className="min-w-0"><h1 className="text-xl font-bold leading-tight text-ink">{cur.title}</h1><p className="text-xs text-neutral-400">{cur.sub}</p></div>
        <div className="ml-auto hidden sm:flex items-center gap-2 rounded-xl border border-neutral-200 bg-white px-3 py-2 w-56"><Search/><input placeholder="Rechercher…" className="w-full bg-transparent text-sm outline-none"/></div>
        <span className="hidden sm:inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-bold text-emerald-600"><span className="h-2 w-2 rounded-full bg-emerald-500"/> Synchronisé</span>
      </header>
      <div className="flex-1 overflow-y-auto scroll p-4 md:p-6">{cur.view}</div>
    </main>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
