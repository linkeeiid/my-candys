  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    color:#2A0A1C;
    background:radial-gradient(1200px 700px at 50% -10%,#FFE3F1 0%,#FFF6FB 45%,#FFFFFF 100%);
    display:flex;align-items:center;justify-content:center;padding:24px;min-height:100%;
  }
  .card{
    width:100%;max-width:520px;text-align:center;
    background:#fff;border:1px solid #F3D9E9;border-radius:26px;
    box-shadow:0 30px 70px rgba(224,23,132,.16);
    padding:44px 30px 34px;position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;
    background:linear-gradient(90deg,#FF2E9A,#E01784,#FFB3DC)}
  .logo{width:132px;height:auto;margin:0 auto 20px;display:block}
  .emoji{font-size:40px;line-height:1;margin-bottom:10px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-bottom:10px}
  h1 .pink{color:#E01784}
  p{font-size:15.5px;line-height:1.6;color:#6B4A5A;margin:0 auto 8px;max-width:400px}
  .sub{font-size:13.5px;color:#9A7D8E;margin-top:14px}
  .socials{display:flex;gap:12px;justify-content:center;margin-top:26px}
  .socials a{
    width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    text-decoration:none;transition:transform .12s}
  .socials a:hover{transform:translateY(-2px)}
  .ig{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF,#515BD4)}
  .tk{background:#010101}
  .sn{background:#FFFC00}
  .socials svg{width:22px;height:22px}
  .foot{margin-top:26px;font-size:11.5px;color:#B7A0AC}
</style>
