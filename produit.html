<style>
/* ---------- Fil d'Ariane ---------- */
.pd-crumbwrap{max-width:1220px;margin:0 auto;padding:22px 34px 0}

/* ---------- Bloc produit (2 colonnes) ---------- */
.pd{max-width:1220px;margin:0 auto;padding:20px 34px 10px;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start}
.pd-media{position:sticky;top:150px}
.pd-hero{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:1/1;box-shadow:0 18px 40px rgba(122,14,74,.14);cursor:zoom-in}
.pd-hero .pd-photo{transition:transform .18s ease-out;will-change:transform;transform-origin:center center}
.pd-hero:hover .pd-photo{transform:scale(2.6)}
@media(hover:none){.pd-hero{cursor:default}.pd-hero:hover .pd-photo{transform:none}}
.pd-hero-badge{position:absolute;top:16px;left:16px;background:#2A0A1C;color:#fff;font-weight:800;font-size:12px;padding:6px 12px;border-radius:999px;pointer-events:none;z-index:2}
.pd-hero-label{position:absolute;bottom:14px;right:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:#2A0A1C;background:rgba(255,255,255,.66);padding:4px 10px;border-radius:999px;pointer-events:none;z-index:2;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-thumbs{display:none}
.pd-thumb{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1/1;box-shadow:0 6px 16px rgba(122,14,74,.1)}
.pd-thumb.on{outline:2px solid #E01784;outline-offset:-2px}

.pd-eyebrow{font-size:12.5px;color:#B06089;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.pd-title{font-weight:800;font-size:40px;margin:6px 0 0;letter-spacing:-1px;line-height:1.03}
.pd-rating{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.pd-stars{color:#FFB800;font-size:18px;letter-spacing:1px}
.pd-note{font-weight:800;font-size:15px}
.pd-revlink{font-size:14px;color:#8A6076}
.pd-revlink:hover{color:#E01784}
.pd-stock{background:#EAFBF3;color:#1B8A57;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.pd-stock.low{background:#FFF3E8;color:#D9481B}
.pd-stock.out{background:#FDECEC;color:#C62A22}
.pd-add[disabled]{filter:grayscale(.35);opacity:.55;box-shadow:none;cursor:not-allowed}
.pd-add[disabled]:hover{transform:none;filter:grayscale(.35)}
.pd-step.is-off{opacity:.5;pointer-events:none}
.pd-price{display:flex;align-items:baseline;gap:12px;margin-top:20px;flex-wrap:wrap}
.pd-now{font-weight:800;font-size:38px;color:#E01784;letter-spacing:-1px}
.pd-old{font-size:17px;color:#B7A0AC;text-decoration:line-through}
.pd-badge{font-weight:800;font-size:13px;padding:5px 11px;border-radius:999px}
.pd-unit{font-size:12.5px;color:#8A6076;margin-top:4px}
.pd-desc{font-size:15.5px;line-height:1.6;color:#4A2A3A;margin:20px 0 0}
.pd-tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.pd-tag{background:#FFF1F8;border:1px solid #F6DBEB;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;color:#4A2A3A}

.pd-buy{display:flex;align-items:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.pd-step{display:flex;align-items:center;gap:2px;background:#fff;border:1.5px solid #F3C6DE;border-radius:14px;overflow:hidden}
.pd-step button{width:46px;height:52px;color:#E01784;font-size:22px;font-weight:700;transition:background .12s}
.pd-step button:hover{background:#FFF1F8}
.pd-step span{min-width:36px;text-align:center;font-weight:800;font-size:17px}
.pd-add{flex:1;min-width:220px;background:linear-gradient(135deg,#FF2E9A,#E01784);color:#fff;font-weight:800;font-size:17px;padding:16px 26px;border-radius:16px;box-shadow:0 12px 26px rgba(255,46,154,.32);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s,filter .15s}
.pd-add:hover{transform:translateY(-2px);filter:brightness(1.03)}
.pd-add:active{transform:translateY(0)}
.pd-wish{flex:none;width:52px;height:52px;border-radius:14px;border:1.5px solid #F3C6DE;background:#fff;font-size:22px;color:#B7A0AC;display:flex;align-items:center;justify-content:center;transition:background .15s}
.pd-wish:hover{background:#FFEBF5}
.pd-wish.is-on{color:#E01784;border-color:#F3A9D0;background:#FFF1F8}

.pd-reassure{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.pd-reass{display:flex;align-items:center;gap:10px;background:#F8FBFC;border:1px solid #E6EFF2;border-radius:14px;padding:12px}
.pd-reass > span{font-size:22px;line-height:1}
.pd-reass > div{font-size:12.5px;font-weight:600;line-height:1.3}

.pd-acc{margin-top:24px;border-top:1px solid #F1DAE7}
.pd-acc-item{border-bottom:1px solid #F1DAE7}
.pd-acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px;font-weight:700;font-size:15px;color:#2A0A1C;text-align:left}
.pd-acc-head > span{color:#E01784;font-size:20px}
.pd-acc-body{font-size:14px;line-height:1.6;color:#6A4A58;padding:0 2px 18px}
.pd-acc-body .pd-lead{font-size:15px;line-height:1.65;color:#3A2230;font-weight:600;margin:2px 0 6px}
.pd-acc-body h4{font-size:16px;font-weight:800;color:#2A0A1C;margin:18px 0 6px;letter-spacing:-.2px;line-height:1.25}
.pd-acc-body p{margin:0 0 10px}
.pd-specs{list-style:none;margin:8px 0 0;padding:0}
.pd-specs li{position:relative;padding:7px 0 7px 18px;border-bottom:1px solid #F6E4EF;font-size:14px;color:#4A2A3A}
.pd-specs li::before{content:"•";position:absolute;left:3px;color:#E01784;font-weight:800}
.pd-specs b{color:#2A0A1C}
.pd-note-soft{font-style:italic;color:#8A6076;font-size:13px;margin-top:10px}

/* ---------- Détails (accordéons pleine largeur, comme My American Shop) ---------- */
.pd-details{max-width:1220px;margin:0 auto;padding:14px 34px 0}
.pd-details .pd-acc{margin-top:0}

/* ---------- Barre d'achat flottante (mobile + desktop) ---------- */
.pd-sticky{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid #F1DAE7;box-shadow:0 -8px 26px rgba(122,14,74,.13);transform:translateY(115%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.pd-sticky.is-on{transform:translateY(0)}
.pd-sticky-in{max-width:1220px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.pd-sticky-img{width:48px;height:48px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid #F1DAE7;flex:none}
.pd-sticky-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pd-sticky-name{font-weight:800;font-size:15px;color:#2A0A1C;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-sticky-price{font-weight:800;font-size:15px;color:#E01784}
.pd-sticky-add{flex:none;background:linear-gradient(135deg,#FF2E9A,#E01784);color:#fff;font-weight:800;font-size:15px;padding:13px 24px;border-radius:14px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 18px rgba(255,46,154,.32);transition:transform .15s,filter .15s;white-space:nowrap}
.pd-sticky-add:hover{transform:translateY(-1px);filter:brightness(1.03)}
.pd-sticky-x{flex:none;width:36px;height:36px;border-radius:10px;color:#B7A0AC;font-size:16px;display:none;align-items:center;justify-content:center}
.pd-sticky-x:hover{background:#FFEBF5;color:#E01784}

/* ---------- Avis ---------- */
.pd-reviews{max-width:1220px;margin:0 auto;padding:40px 34px 10px}
.pd-reviews h2{font-weight:800;font-size:28px;margin:0 0 6px;letter-spacing:-.5px}
.pd-rev-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.pd-rev-big{font-weight:800;font-size:34px;color:#E01784}
.pd-rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pd-rev{background:#FFF7EE;border-radius:18px;padding:22px}
.pd-rev-head{display:flex;align-items:center;gap:6px}
.pd-rev-verified{background:#EAFBF3;color:#1B8A57;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pd-rev p{font-size:14.5px;line-height:1.55;color:#3A2230;margin:12px 0 14px}
.pd-rev-who{display:flex;align-items:center;gap:10px}
.pd-rev-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.pd-rev-name{font-size:13px;font-weight:700}

/* ---------- Tu aimeras aussi ---------- */
.pd-related{max-width:1220px;margin:0 auto;padding:34px 34px 50px}
.pd-related-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.pd-related-head h2{font-weight:800;font-size:28px;margin:0;letter-spacing:-.5px}
.pd-related-more{font-weight:700;font-size:14.5px;color:#E01784;border:2px solid #FFC4E2;padding:9px 18px;border-radius:999px;flex:none}
.pd-related-more:hover{background:#FFEBF5}
.mc-prow{display:flex;gap:16px;overflow-x:auto;padding:8px 2px 20px;scroll-snap-type:x mandatory}
.mc-prow .mc-prod{width:calc((100% - 64px)/5);scroll-snap-align:start}

@media (max-width:980px){.mc-prow .mc-prod{width:calc((100% - 48px)/4)}}
@media (max-width:860px){
  .pd-crumbwrap{padding:16px 16px 0}
  .pd{grid-template-columns:1fr;padding:16px 16px 6px;gap:22px}
  .pd-media{position:static;top:auto}
  .pd-title{font-size:28px}
  .pd-now{font-size:32px}
  .pd-add{min-width:0;font-size:16px;padding:15px 18px}
  .pd-reassure{grid-template-columns:repeat(3,1fr);gap:8px}
  .pd-reass{flex-direction:column;text-align:center;gap:5px;padding:11px 6px}
  .pd-reass > span{font-size:20px}
  .pd-reass > div{font-size:11px;line-height:1.25}
  .pd-reviews,.pd-related{padding-left:16px;padding-right:16px}
  .pd-rev-grid{grid-template-columns:1fr}
  .pd-reviews h2,.pd-related-head h2{font-size:22px}
  .mc-prow .mc-prod{width:200px}
  .pd-details{padding:12px 16px 0}
  .pd-sticky-img{display:none}
  .pd-sticky-in{padding:9px 14px;gap:10px}
  .pd-sticky-add{padding:12px 18px;font-size:14px}
  .pd-sticky-name{font-size:13.5px}
  .pd-sticky-price{font-size:13px}
}
</style>

  /* Description enrichie générée par catégorie (marketing — pas de données factuelles inventées) */
  var RICH = {
    'Sodas': { h1: 'Le soda viral que tout le monde s\'arrache', p1: "Oublie les sodas basiques du supermarché du coin. {name}, c'est une référence importée, de celles qu'on découvre sur TikTok et qu'on ne trouve pas partout. Même plaisir pétillant, mais avec un profil de goût qui sort vraiment de l'ordinaire.", h2: 'Pourquoi on l\'adore', p2: "Une recette qui claque, une couleur qui se remarque et cette sensation ultra-rafraîchissante qu'on recherche. Le genre de boisson qu'on partage, qu'on collectionne et qu'on recommande autour de soi.", use: "Sers-la bien fraîche, directement à la canette ou sur glace pour un maximum de fraîcheur. Parfaite pour une session gaming, une soirée qui démarre, une pause révisions ou juste pour te faire plaisir.", note: "À consommer avec modération. Certaines boissons énergisantes sont riches en caféine et déconseillées aux enfants et aux femmes enceintes ou allaitantes." },
    'Snacks': { h1: 'Le snack qui cartonne sur TikTok', p1: "{name}, c'est le snack qu'on voit partout dans les vidéos et qu'on s'arrache. Importé pour de vrai, exactement comme dans les feeds — croquant addictif et assaisonnement qui envoie.", h2: 'Ce qui le rend addictif', p2: "Une texture ultra-croustillante, un goût qui reste en bouche et ce petit côté \"encore une poignée\" impossible à contrôler. À partager… ou pas.", use: "Parfait pour l'apéro, une soirée film, une pause entre potes ou un défi TikTok. Ouvre, partage (si tu veux bien) et profite.", note: "Peut contenir des allergènes (gluten, lait, soja, fruits à coque). Vérifie toujours l'emballage d'origine." },
    'Bonbons': { h1: 'Les bonbons qui affolent les feeds', p1: "{name}, ce sont ces bonbons aux couleurs de folie et au goût explosif qu'on découvre sur TikTok. La confiserie version internationale, livrée directement chez toi.", h2: 'Pourquoi on craque', p2: "Texture parfaite, goût intense et format à partager (ou à garder pour soi). Impossible de s'arrêter à un seul.", use: "À grignoter devant une série, à partager entre amis ou à offrir. L'encas sucré parfait pour se faire plaisir.", note: "Confiserie riche en sucres. Peut contenir des traces d'allergènes — voir l'emballage d'origine." },
    'Chocolats': { h1: 'Le chocolat qu\'on t\'a fait découvrir en story', p1: "{name}, c'est cette édition chocolatée internationale, fondante et ultra-régressive, qu'on ne trouve pas dans toutes les épiceries. Un vrai coup de cœur gourmand.", h2: 'Ce qui le rend spécial', p2: "Un chocolat généreux, une texture qui fond juste comme il faut et ce petit plaisir réconfortant à chaque bouchée.", use: "Idéal pour une pause douceur, à partager en soirée, à offrir ou à garder précieusement pour toi.", note: "Contient généralement lait et soja, peut contenir des fruits à coque. Voir l'emballage d'origine." },
    'Épicé': { h1: 'Le kit épicé qui enflamme TikTok', p1: "{name}, c'est l'expérience sucré-acidulé-brûlant à tester entre potes. Le genre de produit qui fait le buzz et qui se partage en vidéo.", h2: 'L\'expérience', p2: "Un mélange de saveurs qui joue sur tous les tableaux : sucré, acide et piquant. Sensations garanties (et un peu de sueur).", use: "À tester entre amis pour le fun, en défi ou juste par curiosité. Prépare un verre d'eau à côté, on ne sait jamais.", note: "Produit relevé, peut contenir sulfites et colorants. Voir l'emballage d'origine." },
    'Desserts': { h1: 'Le dessert viral venu d\'ailleurs', p1: "{name}, c'est cette gourmandise glacée ou lactée qu'on découvre sur les réseaux : texture unique, goût délicat et format parfait pour la photo.", h2: 'Pourquoi on l\'adore', p2: "Un petit voyage gourmand à chaque bouchée, avec ce côté original qu'on ne trouve pas au supermarché du coin.", use: "À déguster bien frais, en fin de repas ou en pause plaisir. Parfait pour épater sur une story.", note: "Peut contenir lait, gluten ou soja. Voir l'emballage d'origine." }
  };
  /* --- Description narrative PERSONNALISÉE par produit ---
     parfum/type détecté dans le nom + variations déterministes (chaque fiche a un texte différent) */
  function normn(s) { return (s || '').toLowerCase().replace(/[àâä]/g, 'a').replace(/[éèêë]/g, 'e').replace(/[îï]/g, 'i').replace(/[ôö]/g, 'o').replace(/[ûü]/g, 'u').replace(/ç/g, 'c'); }
  var FLAV = [
    [['choco', 'chocolat', 'bueno', 'brownie', 'cookie', 'nutella', 'oreo', 'kinder', 'milka', 'twix', 'snicker', 'kitkat', 'bounty', 'lion', 'reese', 'feastable', 'hershey', 'cacao', 'praline', 'schoko', 'cioccolat', 'nachos'], "le chocolat fondant et ultra-gourmand"],
    [['fraise', 'strawberry', 'red velvet'], "la fraise juteuse et acidulée"],
    [['framboise', 'raspberry'], "la framboise pétillante et fruitée"],
    [['mangue', 'mango'], "la mangue exotique et ensoleillée"],
    [['cassis'], "le cassis profond et fruité"],
    [['myrtille', 'blueberry'], "des notes de myrtille fraîches et sucrées"],
    [['pasteque', 'watermelon'], "la pastèque juteuse et rafraîchissante"],
    [['pomme', 'apple'], "la pomme croquante et acidulée"],
    [['citron', 'lemon', 'lime', 'citrus', 'agrume'], "l'agrume vif et zesté"],
    [['peche', 'peach', 'abricot'], "la pêche douce et veloutée"],
    [['coco', 'coconut'], "la noix de coco crémeuse et exotique"],
    [['vanille', 'vanilla'], "la vanille douce et réconfortante"],
    [['caramel', 'toffee', 'fudge'], "le caramel fondant et beurré"],
    [['peanut', 'cacahuete', 'arachide'], "le beurre de cacahuète crémeux et addictif"],
    [['banane', 'banana'], "la banane douce et gourmande"],
    [['raisin', 'grape'], "le raisin sucré et pétillant"],
    [['ananas', 'pineapple'], "l'ananas juteux et ensoleillé"],
    [['bubble', 'tutti', 'chewing'], "ce goût bubble-gum nostalgique"],
    [['cola', 'coca', 'pepsi'], "le cola pétillant et culte"],
    [['orange', 'fanta'], "l'orange pétillante et solaire"],
    [['fuego', 'spicy', 'chili', 'piment', 'buldak', 'samyang', 'nitro', 'pili', 'sriracha', 'jalapeno', 'picante', 'habanero', 'hot '], "un piquant qui réveille les papilles"],
    [['cheese', 'fromage', 'cheddar'], "ce goût fromage salé irrésistible"],
    [['bbq', 'barbecue', 'smoke'], "un goût barbecue fumé et savoureux"],
    [['sour', 'acide', 'pica', 'extreme'], "une acidité qui pique juste ce qu'il faut"],
    [['salt', 'salee', 'salted'], "ce croustillant salé qu'on ne lâche plus"]
  ];
  function flavorOf(nm) {
    var n = normn(nm), i;
    for (i = 0; i < FLAV.length; i++) { if (FLAV[i][0].some(function (k) { return n.indexOf(k) >= 0; })) return FLAV[i][1]; }
    return ({ 'Sodas': "un goût pétillant qui sort de l'ordinaire", 'Snacks': "un croquant assaisonné qui claque", 'Bonbons': "un goût sucré explosif", 'Chocolats': "un chocolat fondant et gourmand", 'Épicé': "un mélange sucré-épicé intense", 'Desserts': "une douceur délicate et originale" }[CAT] || "un goût unique qui fait le buzz");
  }
  var OPEN = [
    "Il y a des produits qu'on repère au premier coup d'œil, et {name} en fait clairement partie.",
    "Tu l'as sûrement vu passer sur TikTok : {name}, c'est LE genre de trouvaille qu'on s'arrache.",
    "Laisse-moi te présenter {name} — une petite pépite qu'on ne croise pas au supermarché du coin.",
    "{name}, c'est le genre de produit qui transforme une simple envie de grignoter en vrai petit moment.",
    "Certains snacks se contentent d'être bons. {name}, lui, a carrément une personnalité.",
    "On ne va pas se mentir : {name}, ça devient vite une petite obsession dès qu'on y a goûté une fois."
  ];
  var TASTE = [
    "Dès la première bouchée, {flavor} prend le dessus — et on comprend tout de suite pourquoi ça fait autant parler.",
    "Ce qui fait toute la différence ici, c'est {flavor} : franc, généreux, exactement comme on l'espérait.",
    "En bouche, c'est {flavor} qui mène la danse. Simple, efficace, diablement satisfaisant.",
    "Le secret ? {flavor}, dosé pile comme il faut pour qu'on y revienne encore et encore.",
    "À la dégustation, {flavor} se déploie tranquillement et installe ce petit effet « j'en reprends »."
  ];
  var STORY = [
    "Importé pour de vrai, {name} fait partie de ces références qu'on déniche aux quatre coins du monde et qu'on ramène rien que pour toi. Pas de version « supermarché » édulcorée : l'original, celui que les vrais fans s'échangent.",
    "Chez My Candy's, on chasse ce genre de trouvailles introuvables ailleurs. {name} arrive tout droit de sa sélection d'origine, exactement comme dans les vidéos qui t'ont donné envie.",
    "{name}, tu ne le croiseras pas entre deux packs d'eau au supermarché. C'est une trouvaille d'import, de celles qui rendent une commande un peu plus excitante à ouvrir.",
    "On a flashé sur {name} pour une raison simple : c'est authentique, difficile à trouver, et ça a ce petit truc en plus que les versions locales n'ont pas."
  ];
  var MOMENT = [
    "Le bon moment pour le sortir ? Une soirée qui démarre, une session gaming, une pause révisions, ou juste une envie de te faire plaisir sans te justifier.",
    "À savourer devant une série, à partager entre potes (si tu es d'humeur généreuse) ou à garder précieusement pour toi. Aucun jugement ici.",
    "Parfait pour une pause gourmande, un cadeau qui change de l'ordinaire, ou simplement pour t'offrir un petit shot de plaisir dans la journée.",
    "Que ce soit pour une envie de dernière minute, un moment cocooning ou une soirée entre amis, {name} tombe toujours au bon moment."
  ];
  function pickV(arr, seed) { return arr[seed % arr.length]; }
  function richDesc() {
    var seed = 0, i; for (i = 0; i < p.id.length; i++) seed += p.id.charCodeAt(i);
    var nm = '<b>' + MC.esc(p.name) + '</b>', fl = flavorOf(p.name);
    function F(s) { return s.replace(/\{name\}/g, nm).replace(/\{flavor\}/g, fl); }
    return '<p>' + F(pickV(OPEN, seed)) + '</p>' +
           '<p>' + F(pickV(TASTE, seed + 2)) + '</p>' +
           '<p>' + F(pickV(STORY, seed + 1)) + '</p>' +
           '<p>' + F(pickV(MOMENT, seed + 3)) + '</p>';
  }

  /* --- Titre & fil d'Ariane --- */
  document.title = p.name + " — My Candy's";
  $('pd-crumb').innerHTML =
    '<a href="index.html">Accueil</a> › <a href="boutique.html">Boutique</a> › ' +
    '<a href="boutique.html">' + MC.esc(CAT) + '</a> › ' +
    '<span style="color:#2A0A1C;font-weight:600">' + MC.esc(p.name) + '</span>';

  /* --- Média : image principale + vignettes --- */
  var hero = $('pd-hero');
  $('pd-hero-badge').textContent = p.best ? '🔥 VIRAL TIKTOK' : (p.nouveau ? '⭐ NOUVEAU' : '🩷 Coup de cœur');
  if (p.img) {
    hero.style.background = '#fff';
    hero.insertAdjacentHTML('afterbegin', '<img class="pd-photo" src="' + p.img + '" alt="' + MC.esc(p.name) + '">');
    var lbl = $('pd-hero-label'); if (lbl) lbl.style.display = 'none';
    $('pd-thumbs').innerHTML = '<div class="pd-thumb on" style="background:#fff"><img class="pd-photo" src="' + p.img + '" alt=""></div>';
  } else {
    hero.style.background = p.tint;
    $('pd-hero-label').textContent = 'photo · ' + p.name;
    var alt = [MC.T.pink, MC.T.cyan, MC.T.yellow, MC.T.green, MC.T.purple, MC.T.orange, MC.T.blue]
      .filter(function (t) { return t !== p.tint; });
    var thumbTints = [p.tint, alt[0], alt[1], alt[2]];
    $('pd-thumbs').innerHTML = thumbTints.map(function (t, i) {
      return '<div class="pd-thumb' + (i === 0 ? ' on' : '') + '" style="background:' + t + '">' +
               '<div class="mc-stripes"></div></div>';
    }).join('');
  }
  /* --- Zoom au survol : le point de zoom suit le curseur --- */
  hero.addEventListener('mousemove', function (e) {
    var im = hero.querySelector('.pd-photo'); if (!im) return;
    var r = hero.getBoundingClientRect();
    im.style.transformOrigin = ((e.clientX - r.left) / r.width * 100) + '% ' + ((e.clientY - r.top) / r.height * 100) + '%';
  });
  hero.addEventListener('mouseleave', function () { var im = hero.querySelector('.pd-photo'); if (im) im.style.transformOrigin = 'center center'; });

  /* --- Infos --- */
  $('pd-eyebrow').textContent = (p.brand ? p.brand + ' · ' : '') + CAT;
  $('pd-title').textContent = p.name;

  var badge = MC.badge(p);
  $('pd-price').innerHTML =
    '<span class="pd-now">' + MC.money(p.price) + '</span>' +
    (p.old ? '<span class="pd-old">' + MC.money(p.old) + '</span>' : '') +
    (badge ? '<span class="pd-badge" style="background:' + badge.bg + ';color:' + badge.color + '">' + badge.text + '</span>' : '');
  $('pd-unit').textContent = p.old
    ? ('💸 Tu économises ' + MC.money(p.old - p.price) + ' · TVA incluse')
    : 'TVA incluse · Livraison offerte dès 39 €';

  $('pd-desc').textContent = descText;
  $('pd-tags').innerHTML = tags.map(function (t) { return '<div class="pd-tag">' + MC.esc(t) + '</div>'; }).join('');

  /* --- Sélecteur de quantité + Ajout au panier (stock temps réel Firebase) --- */
  var addBtn = $('pd-add'), qtyEl = $('pd-qty'), stockPill = $('pd-stock');
  var stepEl = document.querySelector('.pd-step');
  // Quantité disponible : nombre connu, ou Infini si stock inconnu (jamais bloquant).
  function avail() {
    if (!window.MCStock) return Infinity;
    var v = MCStock.get(p.id);
    return v === null ? Infinity : v;
  }
  function refreshAdd() {
    var a = avail();
    if (qty > a) qty = Math.max(1, a);
    qtyEl.textContent = qty;
    if (a <= 0) {
      addBtn.disabled = true;
      addBtn.textContent = '😔 Rupture de stock';
      if (stepEl) stepEl.classList.add('is-off');
    } else {
      addBtn.disabled = false;
      addBtn.textContent = '🛒 Ajouter au panier — ' + MC.money(p.price * qty);
      if (stepEl) stepEl.classList.remove('is-off');
    }
  }
  function refreshStockPill() {
    if (!stockPill) return;
    var a = avail();
    if (a === Infinity) { stockPill.className = 'pd-stock'; stockPill.textContent = '● En stock'; }
    else if (a <= 0) { stockPill.className = 'pd-stock out'; stockPill.textContent = '● Rupture de stock'; }
    else if (window.MCStock && a <= MCStock.LOW) { stockPill.className = 'pd-stock low'; stockPill.textContent = '🔥 Plus que ' + a + ' en stock'; }
    else { stockPill.className = 'pd-stock'; stockPill.textContent = '● En stock'; }
  }
  function refreshStock() { refreshStockPill(); refreshAdd(); }
  refreshStock();
  $('pd-inc').addEventListener('click', function () { if (qty < avail()) { qty++; refreshAdd(); } });
  $('pd-dec').addEventListener('click', function () { qty = Math.max(1, qty - 1); refreshAdd(); });
  addBtn.addEventListener('click', function () {
    var a = avail();
    if (a <= 0) { MCui.toast('Rupture de stock 😔'); return; }
    var inCart = 0;
    try { var l = MCCart.items().filter(function (x) { return x.id === p.id; })[0]; inCart = l ? l.qty : 0; } catch (e) {}
    var canAdd = a - inCart;
    if (canAdd <= 0) { MCui.toast('Tu as déjà tout le stock dispo (' + a + ') dans ton panier'); return; }
    if (qty > canAdd) {
      MCCart.add({ id: p.id, name: p.name, price: p.price, tint: p.tint, old: p.old }, canAdd);
      MCui.toast('Ajouté : il ne reste que ' + a + ' en stock');
    } else {
      MCCart.add({ id: p.id, name: p.name, price: p.price, tint: p.tint, old: p.old }, qty);
      MCui.toast(p.name + ' ajouté au panier');
    }
  });
  window.addEventListener('mc-stock-change', refreshStock);

  /* --- Cœur favori (branché sur MCWish via la délégation d'app.js) --- */
  var wishBtn = $('pd-wish');
  wishBtn.setAttribute('data-wish', p.id);
  var wished = window.MCWish && MCWish.has(p.id);
  wishBtn.classList.toggle('is-on', !!wished);
  wishBtn.textContent = wished ? '❤️' : '🤍';

  /* --- Barre d'achat flottante (mobile + desktop) : apparaît quand le bouton principal sort de l'écran --- */
  var sticky = $('pd-sticky');
  if (sticky) {
    var stName = $('pd-sticky-name'), stPrice = $('pd-sticky-price'), stImg = $('pd-sticky-img'), stAdd = $('pd-sticky-add'), stX = $('pd-sticky-x'), stDismissed = false;
    if (stName) stName.textContent = p.name;
    if (stPrice) stPrice.textContent = MC.money(p.price);
    if (stImg) { if (p.img) { stImg.src = p.img; stImg.alt = p.name; } else { stImg.style.display = 'none'; } }
    function showSticky(on) { sticky.classList.toggle('is-on', on && !stDismissed); }
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (entries) { showSticky(!entries[0].isIntersecting); }, { rootMargin: '0px 0px -60px 0px' });
      io.observe(addBtn);
    }
    if (stAdd) stAdd.addEventListener('click', function () { addBtn.click(); });
    if (stX) stX.addEventListener('click', function () { stDismissed = true; showSticky(false); });
  }

  /* --- Accordéons --- */
  var ACC = [
    { k: 'desc',  title: 'Description',              body: richDesc() },
    { k: 'compo', title: 'Composition',              body: '<p>' + MC.esc(compoText) + '</p>' },
    { k: 'nutri', title: 'Valeurs nutritionnelles',  body: '<p>' + MC.esc(nutriText) + '</p>' }
  ];
  var open = null, accWrap = $('pd-acc');
  function renderAcc() {
    accWrap.innerHTML = ACC.map(function (a) {
      var on = a.k === open;
      return '<div class="pd-acc-item">' +
               '<button class="pd-acc-head" data-acc="' + a.k + '">' + MC.esc(a.title) +
                 '<span>' + (on ? '−' : '+') + '</span></button>' +
               (on ? '<div class="pd-acc-body">' + a.body + '</div>' : '') +
             '</div>';
    }).join('');
  }
  renderAcc();
  accWrap.addEventListener('click', function (e) {
    var t = e.target.closest('[data-acc]'); if (!t) return;
    var k = t.getAttribute('data-acc');
    open = (open === k ? null : k);
    renderAcc();
  });

  /* --- Tu aimeras aussi : même catégorie ou même marque (4-5) --- */
  var rel = MC.PRODUCTS.filter(function (x) {
    return x.id !== p.id && (x.cat === p.cat || (p.brand && x.brand === p.brand));
  });
  if (rel.length < 4) {
    MC.PRODUCTS.forEach(function (x) {
      if (rel.length < 5 && x.id !== p.id && x.best && rel.indexOf(x) < 0) rel.push(x);
    });
  }
  rel = rel.slice(0, 5);
  $('pd-related').innerHTML = rel.map(MC.card).join('');
})();
</script>
</body>
</html>
