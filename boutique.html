<style>
.shop-hero{background:#fff;position:relative;overflow:hidden}
.shop-hero-in{max-width:1280px;margin:0 auto;padding:30px 34px 26px;position:relative;z-index:1}
.shop-hero h1{font-size:44px;letter-spacing:-1px;margin:0}
.shop-hero-decor{position:absolute;z-index:0;pointer-events:none;animation:floaty 8s ease-in-out infinite;filter:drop-shadow(0 22px 16px rgba(0,0,0,.22))}
.shop-band{background:#E9F5FB;position:relative}
.shop-wrap{max-width:1280px;margin:0 auto;padding:26px 34px 40px;display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
.shop-aside{position:sticky;top:150px;background:#fff;border:1px solid #F1DAE7;border-radius:20px;padding:20px 20px 8px}
.shop-aside h2{font-size:17px;margin-bottom:14px}
.shop-fsec{border-top:1px solid #F1DAE7;padding:16px 0 14px}
.shop-fsec > .t{font-weight:700;font-size:14px;margin-bottom:12px}
.shop-cat{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;font-size:13.5px;font-weight:600;text-align:left;color:#4A2A3A;width:100%;transition:background .12s}
.shop-cat:hover{background:#FFF1F8}
.shop-cat.on{background:#FFEBF5;color:#E01784}
.shop-cat span:last-child{font-size:11px;color:#B06089}
.shop-brands{display:flex;flex-wrap:wrap;gap:8px}
.shop-brand{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1.5px solid #F3C6DE;background:#fff;color:#7A5468;transition:.12s}
.shop-brand.on{background:#E01784;color:#fff;border-color:#E01784}
.shop-check{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#4A2A3A;padding:5px 0;cursor:pointer}
.shop-check input{width:17px;height:17px;accent-color:#E01784}
.shop-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.shop-toolbar select{border:1.5px solid #F3C6DE;background:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:600;color:#2A0A1C;outline:none;font-family:inherit}
.shop-chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.shop-chip{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid #F3C6DE;color:#E01784;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px}
.shop-chip:hover{background:#FFEBF5}
.shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.shop-main{min-width:0}
.shop-grid,.shop-grid>*{min-width:0}
.shop-band{overflow-x:clip}
.shop-pager{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin:36px 0 6px}
.shop-page,.shop-page-nav{border:1.5px solid #E7C9DA;background:#fff;color:#2A0A1C;font-family:inherit;font-weight:700;font-size:14px;min-width:40px;height:40px;padding:0 13px;border-radius:11px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
.shop-page:hover,.shop-page-nav:hover{border-color:#FF2E9A;color:#E01784}
.shop-page.on{background:linear-gradient(135deg,#FF2E9A,#E01784);color:#fff;border-color:transparent;cursor:default}
.shop-page-nav[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
.shop-page-dots{color:#B7A0AC;padding:0 2px;font-weight:700}
.shop-empty{text-align:center;padding:70px 20px;color:#8A6076}
.shop-empty .big{font-size:52px}
.shop-empty .t{font-weight:700;font-size:18px;color:#2A0A1C;margin-top:10px}
.shop-empty button{margin-top:16px;background:linear-gradient(135deg,#FF2E9A,#E01784);color:#fff;font-weight:700;font-size:14px;padding:11px 22px;border-radius:12px}
.shop-mobfilter{display:none}
@media (max-width:980px){.shop-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
  .shop-hero h1{font-size:30px}
  .shop-wrap{grid-template-columns:1fr;padding:20px 16px 34px;gap:16px}
  .shop-aside{position:static;top:auto;display:none}
  .shop-aside.open{display:block}
  .shop-mobfilter{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #F3C6DE;color:#E01784;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px}
  .shop-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .shop-hero-decor{display:none!important}
}
</style>

  <div class="shop-hero-in">
    <div class="mc-crumb" style="margin-bottom:8px"><a href="/">Accueil</a> › <span id="shop-crumb" style="color:#2A0A1C;font-weight:600">Boutique</span></div>

<script>
(function () {
  var CATS = ['Bonbons', 'Snacks', 'Sodas', 'Chocolats', 'Épicé', 'Desserts'];
  var BRANDS = (function () { var s = {}; MC.PRODUCTS.forEach(function (p) { if (p.brand) s[p.brand] = 1; }); return Object.keys(s).sort(function (a, b) { return a.localeCompare(b, 'fr'); }); })();
  function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, ''); }
  // Sous-catégories : chaque onglet de menu = un jeu de mots-clés (cherchés dans nom+marque, normalisés)
  var SUBS = {
    gum: ['gum', 'chewing', 'sucette', 'lollipop', 'frizzy', 'popping', 'pushpop'],
    chamallow: ['chamallow', 'marshmallow', 'guimauve'],
    barbeapapa: ['barbeapapa', 'cottoncandy', 'popin'],
    popcorn: ['popcorn', 'palomitas', 'candypop', 'cookiepop', 'netflix', 'werther'],
    biscuit: ['biscuit', 'granola', 'cookie', 'oreo', 'lotus', 'biscoff'],
    jelly: ['jelly', 'gelee', 'gummy', 'gummies', 'hitschies', 'hitchies', 'nerds', 'jarritos', 'fini', 'bazooka', 'swezzy', 'laffytaffy', 'cerdan', 'pappi'],
    mochi: ['mochi'],
    barres: ['snickers', 'twix', 'kitkat', 'mars', 'bounty', 'bueno', 'maltesers', 'milka', 'lion', 'feastables', 'mrbeast'],
    peanut: ['reese', 'peanut', 'cacahuete', 'feastables'],
    dubai: ['dubai', 'arabian', 'kadayif', 'pistache', 'trompe'],
    chips: ['pringles', 'lays', 'cheetos', 'brets', 'chips', 'cracker', 'doritos', 'vico', 'monstermunch', 'flipz', 'pipas', 'nachos', 'buenosdias'],
    takis: ['takis', 'cornchito', 'pilipili', 'samyang', 'buldak'],
    jerky: ['jerky', 'jacklink', 'beef'],
    ramen: ['ramen', 'nouille', 'samyang', 'buldak', 'noodle'],
    americaine: ['poptarts', 'luckycharms', 'frosted', 'kellog', 'nesquik', 'marshmallow'],
    sauce: ['sauce', 'guacamole', 'salsa', 'chamoy'],
    salsa: ['salsa'],
    chamoy: ['chamoy'],
    energy: ['redbull', 'monster', 'prime', 'energy', 'kratingdaeng', 'gameon'],
    sodas: ['fanta', 'coca', 'pepsi', 'sprite', 'mountaindew', 'mtndew', 'drpepper', 'schweppes', 'selecto', 'hamoud', 'lorina', 'poms'],
    the: ['estathe', 'fusetea', 'lipton', 'oolong', 'kombucha', 'icetea', 'starbucks'],
    slush: ['slush', 'icetalk'],
    eau: ['pellegrino', 'mizone', 'vitaminwater', 'vitamin water'],
    jus: ['ifruit', 'hawai', 'caribos', 'calypso', 'lemonade', 'apla', 'caprisun', 'koolaid'],
    bubbletea: ['bubbletea', 'boba'],
    mogu: ['mogu']
  };
  var SUBLABELS = { gum: 'Chewing-gum & sucettes', chamallow: 'Chamallow', barbeapapa: 'Barbe à papa', popcorn: 'Pop-corn', biscuit: 'Biscuits', jelly: 'Gelées & gummies', mochi: 'Mochi', barres: 'Barres chocolatées', peanut: 'Beurre de cacahuète', dubai: 'Chocolat de Dubaï', chips: 'Chips & crackers', takis: 'Takis & snacks épicés', jerky: 'Beef jerky', ramen: 'Ramen & nouilles', americaine: 'Cuisine américaine', sauce: 'Sauces & dips', salsa: 'Salsa', chamoy: 'Chamoy', energy: 'Énergisantes', sodas: 'Sodas viraux', the: 'Thé glacé', slush: 'Slushies', eau: 'Eaux aromatisées', jus: 'Jus de fruits', bubbletea: 'Bubble tea', mogu: 'Mogu Mogu' };
  var params = new URLSearchParams(location.search);
  var st = { cat: 'all', brand: 'all', promo: false, nouv: false, best: false, asie: false, sweet: false, sort: 'pop', q: '', sub: '' };
  var subP = params.get('sub'); if (subP && SUBS[subP]) st.sub = subP;
  var PAGE_SIZE = 30, page = 1;
  var HERO_IMGS = ['kinder-creamy', 'monster-punch', 'nerds', 'pickle', 'reeses', 'samyang'];

  var b = params.get('b'); if (b) st.brand = b;
  var q = params.get('q'); if (q) st.q = q;
  var c = params.get('c');
  var TITLES = {
    'boissons': ['Boissons 🥤', 'Sodas viraux, énergisantes et boissons du monde entier.'],
    'sales': ['Snacks salés 🌶️', 'Chips, Takis, ramen et snacks épicés qui cartonnent.'],
    'sucres': ['Sucré 🍬', 'Bonbons US, chocolats et desserts gourmands.'],
    'asie': ['Spécial Asie 🍜', 'Le meilleur des snacks et boissons venus d\'Asie.'],
    'bestsellers': ['Bestsellers 🩷', 'Les chouchous de la communauté My Candy\'s.'],
    'nouveautes': ['Nouveautés ⭐', 'Fraîchement débarqués dans la boutique.'],
    'promos': ['Promos ⚡', 'Toutes les réductions du moment.'],
    'mini-prix': ['Mini Prix 🪙', 'Les petits prix qui font plaisir.'],
    'squishy': ['Squishy 🌈', 'Bientôt disponible — reviens vite !'],
    'anti-gaspi': ['Anti-Gaspi ♻️', 'Bientôt disponible — reviens vite !'],
    'pick-n-mix': ['Pick\'n\'Mix 🍬', 'Compose ton mélange — bientôt disponible !']
  };
  switch (c) {
    case 'boissons': st.cat = 'Sodas'; break;
    case 'sales': st.cat = 'Snacks'; break;
    case 'sucres': st.sweet = true; break;
    case 'asie': st.asie = true; break;
    case 'bestsellers': st.best = true; break;
    case 'nouveautes': st.nouv = true; break;
    case 'promos': case 'mini-prix': st.promo = true; break;
  }
  if (st.brand !== 'all' && !c) { var d = document.getElementById('shop-title'); if (d) d.textContent = st.brand; }
  if (c && TITLES[c]) { document.getElementById('shop-title').textContent = TITLES[c][0]; document.getElementById('shop-sub').textContent = TITLES[c][1]; document.getElementById('shop-crumb').textContent = TITLES[c][0]; }
  if (st.brand !== 'all') { document.getElementById('shop-crumb').textContent = st.brand; }
  if (st.sub) { var _sl = SUBLABELS[st.sub] || st.sub; document.getElementById('shop-title').textContent = _sl; document.getElementById('shop-crumb').textContent = _sl; }

  document.getElementById('shop-promo').checked = st.promo;
  document.getElementById('shop-new').checked = st.nouv;
  document.getElementById('shop-sort').value = st.sort;

  function count(cat) { return MC.PRODUCTS.filter(function (p) { return p.cat === cat; }).length; }

  function renderSidebar() {
    document.getElementById('shop-cats').innerHTML = CATS.map(function (cat) {
      return '<button class="shop-cat' + (st.cat === cat ? ' on' : '') + '" data-cat="' + cat + '"><span>' + cat + '</span><span>' + count(cat) + '</span></button>';
    }).join('');
    document.getElementById('shop-brands').innerHTML =
      '<select id="shop-brand-sel" style="width:100%;padding:11px 12px;border:1.5px solid #E7C9DA;border-radius:11px;font-family:inherit;font-size:14px;background:#fff;color:#2A0A1C;cursor:pointer">' +
      '<option value="all">Toutes les marques (' + BRANDS.length + ')</option>' +
      BRANDS.map(function (br) { return '<option value="' + MC.esc(br) + '"' + (st.brand === br ? ' selected' : '') + '>' + MC.esc(br) + '</option>'; }).join('') +
      '</select>';
  }

  function filtered() {
    var L = MC.PRODUCTS.slice();
    if (st.cat !== 'all') L = L.filter(function (p) { return p.cat === st.cat; });
    if (st.brand !== 'all') { var bn = norm(st.brand); L = L.filter(function (p) { return norm(p.brand || '') === bn || norm(p.name).indexOf(bn) >= 0; }); }
    if (st.promo) L = L.filter(function (p) { return p.old; });
    if (st.nouv) L = L.filter(function (p) { return p.nouveau; });
    if (st.best) L = L.filter(function (p) { return p.best; });
    if (st.asie) L = L.filter(function (p) { return p.asie; });
    if (st.sweet) L = L.filter(function (p) { return ['Bonbons', 'Chocolats', 'Desserts'].indexOf(p.cat) >= 0; });
    if (st.sub && SUBS[st.sub]) { var kws = SUBS[st.sub]; L = L.filter(function (p) { if (p.sub) return p.sub === st.sub; var hh = norm(p.name + ' ' + (p.brand || '')); return kws.some(function (k) { return hh.indexOf(k) >= 0; }); }); }
    if (st.q) { var toks = st.q.split(/\s+/).map(norm).filter(Boolean); if (toks.length) L = L.filter(function (p) { var h = norm(p.name + ' ' + (p.brand || '')); return toks.every(function (t) { return h.indexOf(t) >= 0; }); }); }
    if (st.sort === 'priceUp') L.sort(function (a, b) { return a.price - b.price; });
    else if (st.sort === 'priceDown') L.sort(function (a, b) { return b.price - a.price; });
    else if (st.sort === 'new') L.sort(function (a, b) { return (b.nouveau ? 1 : 0) - (a.nouveau ? 1 : 0); });
    return L;
  }

  function chips() {
    var out = [];
    if (st.cat !== 'all') out.push({ k: 'cat', label: st.cat });
    if (st.brand !== 'all') out.push({ k: 'brand', label: st.brand });
    if (st.promo) out.push({ k: 'promo', label: 'En promo' });
    if (st.nouv) out.push({ k: 'nouv', label: 'Nouveautés' });
    if (st.best) out.push({ k: 'best', label: 'Bestsellers' });
    if (st.asie) out.push({ k: 'asie', label: 'Asie' });
    if (st.sweet) out.push({ k: 'sweet', label: 'Sucré' });
    if (st.sub) out.push({ k: 'sub', label: SUBLABELS[st.sub] || st.sub });
    if (st.q) out.push({ k: 'q', label: '“' + st.q + '”' });
    return out;
  }

  // Articles flottants du hero : duo aléatoire — produits ET positions changent à chaque chargement.
  // Les deux restent dans la moitié DROITE (jamais sur le texte de gauche) et sont bien séparés :
  // l'un en haut-droite, l'autre plus bas et légèrement rentré → ils ne se collent plus.
  function rotateHero() {
    var decos = document.querySelectorAll('.shop-hero-decor');
    if (decos.length < 2) return;
    var pool = HERO_IMGS.slice(), pick = [];
    pick.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    pick.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    var POS_A = [{ right: '1%', top: '-12px', r: 8 }, { right: '3%', top: '-6px', r: -7 }, { right: '2%', top: '-10px', r: 10 }];
    var POS_B = [{ right: '12%', top: '58px', r: -9 }, { right: '14%', top: '64px', r: 8 }, { right: '10%', top: '52px', r: -6 }];
    function apply(el, img, p) {
      el.src = 'assets/hero/' + img + '.png';
      el.style.left = 'auto'; el.style.right = p.right; el.style.top = p.top;
      el.style.setProperty('--r', p.r + 'deg');
    }
    apply(decos[0], pick[0], POS_A[Math.floor(Math.random() * POS_A.length)]);
    apply(decos[1], pick[1], POS_B[Math.floor(Math.random() * POS_B.length)]);
  }
  function pageList(cur, total) {
    var out = [], i;
    if (total <= 7) { for (i = 1; i <= total; i++) out.push(i); return out; }
    out.push(1);
    var start = Math.max(2, cur - 1), end = Math.min(total - 1, cur + 1);
    if (start > 2) out.push('…');
    for (i = start; i <= end; i++) out.push(i);
    if (end < total - 1) out.push('…');
    out.push(total);
    return out;
  }
  function renderPager(pages) {
    var el = document.getElementById('shop-pager');
    if (!el) return;
    if (pages <= 1) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'flex';
    var html = '<button class="shop-page-nav" data-page="' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + '>← Précédent</button>';
    pageList(page, pages).forEach(function (n) {
      html += (n === '…') ? '<span class="shop-page-dots">…</span>'
        : '<button class="shop-page' + (n === page ? ' on' : '') + '" data-page="' + n + '">' + n + '</button>';
    });
    html += '<button class="shop-page-nav" data-page="' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + '>Suivant →</button>';
    el.innerHTML = html;
  }
  function apply() { page = 1; rotateHero(); render(); }

  function render() {
    renderSidebar();
    var L = filtered();
    document.getElementById('shop-count').textContent = L.length;
    var pages = Math.max(1, Math.ceil(L.length / PAGE_SIZE));
    if (page > pages) page = pages; if (page < 1) page = 1;
    var slice = L.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
    document.getElementById('shop-grid').innerHTML = slice.map(MC.card).join('');
    renderPager(pages);
    document.getElementById('shop-empty').style.display = L.length ? 'none' : 'block';
    if (!L.length) {
      var et = document.getElementById('shop-empty-title'), es = document.getElementById('shop-empty-sub');
      if (st.brand !== 'all') { et.textContent = 'Les produits ' + st.brand + ' arrivent très vite ! 🔜'; es.textContent = 'En attendant, explore le reste de la boutique.'; }
      else { et.textContent = 'Aucun produit ne correspond'; es.textContent = ''; }
    }
    var ch = chips();
    var cw = document.getElementById('shop-chips');
    if (ch.length) {
      cw.style.display = 'flex';
      cw.innerHTML = '<span style="font-size:13px;color:#8A6076;font-weight:600">Actifs :</span>' +
        ch.map(function (x) { return '<button class="shop-chip" data-clear="' + x.k + '">' + MC.esc(x.label) + ' ✕</button>'; }).join('') +
        '<button data-clear="all" style="font-size:12.5px;font-weight:600;color:#8A6076;text-decoration:underline">Tout effacer</button>';
    } else { cw.style.display = 'none'; cw.innerHTML = ''; }
  }

  // Interactions
  document.getElementById('shop-cats').addEventListener('click', function (e) { var t = e.target.closest('[data-cat]'); if (!t) return; var cat = t.getAttribute('data-cat'); st.cat = (st.cat === cat ? 'all' : cat); st.sweet = false; apply(); });
  window.addEventListener('mc-catalog-updated', function () { if (typeof renderSidebar === 'function') renderSidebar(); render(); });
  document.getElementById('shop-brands').addEventListener('change', function (e) { if (e.target.id !== 'shop-brand-sel') return; st.brand = e.target.value; apply(); });
  document.getElementById('shop-promo').addEventListener('change', function (e) { st.promo = e.target.checked; apply(); });
  document.getElementById('shop-new').addEventListener('change', function (e) { st.nouv = e.target.checked; apply(); });
  document.getElementById('shop-sort').addEventListener('change', function (e) { st.sort = e.target.value; apply(); });
  document.getElementById('shop-chips').addEventListener('click', function (e) {
    var t = e.target.closest('[data-clear]'); if (!t) return;
    var k = t.getAttribute('data-clear');
    if (k === 'all') { st.cat = 'all'; st.brand = 'all'; st.promo = st.nouv = st.best = st.asie = st.sweet = false; st.q = ''; st.sub = ''; }
    else if (k === 'cat') st.cat = 'all';
    else if (k === 'brand') st.brand = 'all';
    else st[k] = (k === 'q' || k === 'sub' ? '' : false);
    document.getElementById('shop-promo').checked = st.promo;
    document.getElementById('shop-new').checked = st.nouv;
    apply();
  });
  document.getElementById('shop-reset').addEventListener('click', function () { st.cat = 'all'; st.brand = 'all'; st.promo = st.nouv = st.best = st.asie = st.sweet = false; st.q = ''; st.sub = ''; document.getElementById('shop-promo').checked = false; document.getElementById('shop-new').checked = false; apply(); });
  document.getElementById('shop-mobfilter').addEventListener('click', function () { document.getElementById('shop-aside').classList.toggle('open'); });
  document.getElementById('shop-pager').addEventListener('click', function (e) {
    var t = e.target.closest('[data-page]'); if (!t || t.disabled) return;
    var n = parseInt(t.getAttribute('data-page'), 10); if (isNaN(n)) return;
    page = n; rotateHero(); render();
    var g = document.getElementById('shop-grid'); if (g) window.scrollTo({ top: g.getBoundingClientRect().top + window.pageYOffset - 140, behavior: 'smooth' });
  });

  apply();
})();
</script>
</body>
</html>
